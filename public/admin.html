<!doctype html><html><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Admin — MAHIRA MEN</title>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Playfair+Display:wght@500;600;700&display=swap" rel="stylesheet"><link rel="stylesheet" href="/assets/style.css"></head>
<body><header class="adminnav"><a class="logo" href="/">MAHIRA <span>MEN</span></a><span>ADMIN STUDIO</span><a href="/">View store ↗</a></header>
<main class="admin"><div class="admin-head"><div><small>CONTROL CENTER</small><h1>Store dashboard</h1></div><button class="btn dark" id="logoutAdmin">LOG OUT</button></div>
<div class="stats" id="stats"></div>
<div class="admin-grid"><section class="panel"><div class="panel-head"><h2>Products</h2><button class="btn" id="newProduct">+ Add product</button></div><div class="table-wrap"><table><thead><tr><th>Product</th><th>Category</th><th>Price</th><th>Stock</th><th>Action</th></tr></thead><tbody id="adminProducts"></tbody></table></div></section>
<section class="panel"><div class="panel-head"><h2>Orders</h2></div><div class="table-wrap"><table><thead><tr><th>#</th><th>Customer</th><th>Total</th><th>Status</th></tr></thead><tbody id="adminOrders"></tbody></table></div></section></div>
<div class="modal" id="productModal"><div class="modal-card"><button class="close" id="closeModal">×</button><h2 id="modalTitle">Add product</h2><form id="productForm"><input name="name" placeholder="Product name" required><div class="two"><input name="price" type="number" placeholder="Price" required><input name="old_price" type="number" placeholder="Old price"></div><div class="two"><input name="category" placeholder="Category" required><input name="color" placeholder="Color"></div><input name="badge" placeholder="Badge (New / Bestseller)"><input name="image" placeholder="Image URL" required><input name="stock" type="number" placeholder="Stock" required><textarea name="description" placeholder="Description"></textarea><button class="btn dark">SAVE PRODUCT</button></form></div></div>
</main><script src="/assets/admin.js"></script></body></html>
